[package]
name = "f2filer"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
eframe = "0.33"
chrono = "0.4"
open = "5"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
hound = "3"
rodio = { version = "0.22", features = ["symphonia-aiff"] }
zip = "8"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
arboard = "3"
parking_lot = "0.12"
encoding_rs = "0.8"
resvg = "0.47"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Ole",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_System_Threading",
]

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
